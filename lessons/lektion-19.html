    { label:"Begrüßung", html:`

      <p>Das ist das Geheimnis der arabischen Sprache — und der Grund, warum ihr nach zwanzig Lektionen

    { label:"Lektion", html:`
      <p>Fast jedes arabische Wort steht auf <b>drei Buchstaben</b>. Diese drei tragen die Bedeutung.

    { label:"Lektion", html:`
      <p>Nehmt <span class="ar">ع - ل - م</span>. Diese drei bedeuten: <i>wissen</i>.</p>

    { label:"Lektion", html:`

    { label:"Lektion", html:`
      <p>Deshalb lohnt sich jedes Wort, das ihr lernt, gleich mehrfach.</p>

      das <span class="ar">لَمۡ</span> von letzter Woche.</p>` },

      <p>Drei Buchstaben, eine ganze Familie. Damit lernt ihr ab jetzt schneller.</p>

      <span class="ar">وعليكم السلام ورحمة الله وبركاته</span></p>` }

    { s:4, html:`<div class="rows">

      </div>` },

    { s:5, html:`<div class="kicker">Sieben Wörter, ein Kern</div>
      <div class="ar ar-xl gold">ع ل م</div>

    { s:6, html:`<div class="kicker">Eine zweite Wurzel</div>

    { s:7, html:`<div class="rows">

      <div class="pair">

      </div>
      <div class="de small step" data-step="1">Zweimal dieselbe Wurzel — einmal lehren, einmal wissen.</div>` },

    { s:12, html:`<div class="ar ar-xl gold">ع ل م</div>
      <div class="de step" data-step="1">Jedes gelernte Wort zahlt sich mehrfach aus.</div>` },

    { s:12, html:`<div class="ar ar-l">وعليكم السلام ورحمة الله وبركاته</div>` }
