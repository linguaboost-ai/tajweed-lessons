const LESSON = {
  no: 4,
  thema: "Nah und fern",
  sections: [
    { label:"Begrüßung", html:`
      <p>Liebe Geschwister, <span class="ar">السلام عليكم ورحمة الله</span>!</p>
      <p>Willkommen zur vierten Lektion.</p>` },
    { label:"Rückblick", html:`
      <p><span class="ar">هٰذَا</span> und <span class="ar">هٰذِهِ</span> zeigen auf etwas Nahes.</p>
      <p>Heute zeigen wir in die Ferne.</p>` },
    { label:"Die neuen Wörter", html:`
      <p class="ar">ذٰلِكَ &nbsp; تِلۡكَ &nbsp; رَيۡب</p>` },
    { label:"Lektion", html:`
      <p>Im Deutschen sagen wir „dies hier" und „das dort". Das Arabische trennt das genauso sauber —
      nur mit eigenen Wörtern.</p>
      <p>Für das Nahe hatten wir <span class="ar">هٰذَا</span> (männlich) und <span class="ar">هٰذِهِ</span>
      (weiblich).</p>` },
    { label:"Lektion", html:`
      <p>Für das Ferne gibt es <span class="ar">ذٰلِكَ</span> (männlich) und <span class="ar">تِلۡكَ</span>
      (weiblich): <i>jener, jene, das dort</i>.</p>
      <p><span class="ar">ذٰلِكَ سَبِيلٌ</span> — Jenes ist ein Weg.<br>
      <span class="ar">تِلۡكَ آيَةٌ</span> — Jenes ist ein Zeichen.</p>` },
    { label:"Lektion", html:`
      <p class="cue">— und jetzt der berühmteste Satz damit —</p>
      <p>Die zweite Sure beginnt mit <span class="ar">ذٰلِكَ الۡكِتَابُ لَا رَيۡبَ فِيهِ</span>.</p>` },
    { label:"Lektion", html:`
      <p>Ihr kennt davon schon fast alles: <span class="ar">ذٰلِكَ</span> — jenes.
      <span class="ar">الۡكِتَابُ</span> — das Buch.</p>
      <p>Zusammen, wie letzte Woche gelernt, keine Aussage,
      sondern eine Wortgruppe: <i>jenes Buch</i>.</p>` },
    { label:"Lektion", html:`
      <p>Neu ist <span class="ar">رَيۡب</span> — <i>Zweifel</i>. Und <span class="ar">لَا</span> heißt
      <i>kein</i>. <span class="ar">فِيهِ</span> heißt <i>darin</i>.</p>
      <p>Also: Jenes Buch — kein Zweifel darin.</p>` },
    { label:"Lektion", html:`
      <p>Warum „jenes" und nicht „dieses", wo das Buch doch vor uns liegt? Die Gelehrten sagen: das Ferne
      steht hier für Erhabenheit. Es ist das Buch <i>dort oben</i>, das hohe Buch.</p>` },
    { label:"Abschluss", html:`
      <p>Vier Zeigewörter: nah und fern, männlich und weiblich. Und mit ihnen versteht ihr den Anfang
      der Sure al-Baqara.</p>` },
    { label:"Abschluss", html:`
      <p>Bis zum nächsten Mal. <span class="ar">وعليكم السلام ورحمة الله وبركاته</span></p>` }
  ],
  slides: [
    { s:0, html:`<div class="title">Quran verstehen lernen

    { s:1, html:`<div class="pair">

    { s:2, html:`<div class="vocab">
        <div class="vrow"><div class="emoji">👆</div><div class="w ar">ذٰلِكَ</div><div class="m"></div></div>
        <div class="vrow step" data-step="1"><div class="emoji">👆</div><div class="w ar">تِلۡكَ</div><div class="m"></div></div>
        <div class="vrow step" data-step="2"><div class="emoji">🤔</div><div class="w ar">رَيۡب</div><div class="m"></div></div>
      </div>` },

    { s:3, html:`<div class="kicker">Die vier Zeigewörter</div>
      <div class="pair">
        <div class="col"><h5>männlich</h5><div class="ar">هٰذَا</div><div class="m">dies</div>
          <div class="ar gold step" data-step="1">ذٰلِكَ</div><div class="m step" data-step="1">jenes</div></div>
        <div class="col"><h5>weiblich</h5><div class="ar">هٰذِهِ</div><div class="m">diese</div>
          <div class="ar gold step" data-step="1">تِلۡكَ</div><div class="m step" data-step="1">jene</div></div>
      </div>` },

    { s:3, html:`<div class="ar ar-xl">ذٰلِكَ سَبِيلٌ</div>
      <div class="de big step" data-step="1">Jenes ist ein Weg.</div>` },

    { s:4, html:`<div class="ar ar-xl">تِلۡكَ آيَةٌ</div>
      <div class="de big step" data-step="1">Jenes ist ein Zeichen.</div>` },

    { s:5, html:`<div class="kicker">Sure 2, Vers 2</div>
      <div class="ar ar-l">ذٰلِكَ الۡكِتَابُ لَا رَيۡبَ فِيهِ</div>` },

    { s:6, html:`<div class="parse wide">
        <div class="cell"><div class="p-ar">ذٰلِكَ</div><div class="arrow">↓</div><div class="p-de">jenes</div></div>
        <div class="cell"><div class="p-ar">الۡكِتَابُ</div><div class="arrow">↓</div><div class="p-de">das Buch</div></div>
        <div class="cell"><div class="p-ar">لَا</div><div class="arrow">↓</div><div class="p-de">kein</div></div>
        <div class="cell"><div class="p-ar">رَيۡبَ</div><div class="arrow">↓</div><div class="p-de">Zweifel</div></div>
        <div class="cell"><div class="p-ar">فِيهِ</div><div class="arrow">↓</div><div class="p-de">darin</div></div>
      </div>
      <div class="de big step" data-step="1">Jenes Buch — kein Zweifel darin.</div>` },

    { s:6, html:`<div class="kicker">Erinnert ihr euch?</div>
      <div class="rows">
        <div class="rowi"><div class="a">ذٰلِكَ كِتَابٌ</div><div class="b">Jenes ist ein Buch. — ein Satz</div></div>
        <div class="rowi step" data-step="1"><div class="a">ذٰلِكَ الۡكِتَابُ</div><div class="b">jenes Buch — eine Wortgruppe</div></div>
      </div>` },

    { s:7, html:`<div class="vocab">
        <div class="vrow"><div class="emoji">🤔</div><div class="w ar">رَيۡب</div><div class="m">Zweifel</div></div>
      </div>` },

    { s:8, html:`<div class="kicker">Warum „jenes" und nicht „dieses"?</div>
      <div class="de big">Das Ferne steht für das Erhabene.</div>
      <div class="de step" data-step="1">Nicht das Buch hier — <b>das Buch dort oben</b>.</div>` },

    { s:9, html:`<div class="rows">
        <div class="rowi"><div class="a">ذٰلِكَ</div><div class="b">jenes (m.)</div></div>
        <div class="rowi"><div class="a">تِلۡكَ</div><div class="b">jene (w.)</div></div>
        <div class="rowi"><div class="a">رَيۡب</div><div class="b">Zweifel</div></div>
      </div>
      <div class="de step" data-step="1"><span class="ar ar-m">ذٰلِكَ الۡكِتَابُ لَا رَيۡبَ فِيهِ</span></div>` },

    { s:10, html:`<div class="ar ar-l">وعليكم السلام ورحمة الله وبركاته</div>` }

  ]
};
