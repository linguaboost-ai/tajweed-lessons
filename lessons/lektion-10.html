<title>Lektion 10 · Nein und nicht — Quran verstehen lernen</title>

<script>
/* =======================================================================
   LEKTIONSDATEN
   slide.s = Nummer der Transkriptbox (0 … sections.length-1)
   Jede Zeile mit class="step" data-step="1" erscheint erst beim
   nächsten Tastendruck.
   ======================================================================= */
const LESSON = {
  no: 10,
  thema: "Nein und nicht",
  sections: [
    { label:"Begrüßung", html:`
      <p>Liebe Geschwister, <span class="ar">السلام عليكم ورحمة الله</span>!</p>
      <p>Willkommen zur zehnten Lektion — der Halbzeit.</p>` },
    { label:"Rückblick", html:`
      <p>In Lektion 4 stand schon ein <span class="ar">لَا</span>: kein Zweifel darin.</p>
      <p>Heute verneinen wir richtig.</p>` },
    { label:"Die neuen Wörter", html:`
      <p class="ar">لَا &nbsp; مَا &nbsp; لَيۡسَ &nbsp; إِلَّا</p>` },
    { label:"Lektion", html:`
      <p>Vier kleine Wörter — und mit ihnen der wichtigste Satz des Islam.</p>
      <p><span class="ar">لَا</span> heißt <i>nein</i> oder <i>kein</i>. Stellt es vor ein Wort, und das
      Wort ist verneint: <span class="ar">لَا رَيۡبَ</span> — kein Zweifel.</p>` },
    { label:"Lektion", html:`
      <p><span class="ar">مَا</span> heißt <i>nicht</i>. Es verneint meist einen ganzen Satz.</p>
      <p><span class="ar">لَيۡسَ</span> heißt <i>ist nicht</i>. Erinnert ihr euch: für „ist" gibt es kein
      Wort.</p>` },
    { label:"Lektion", html:`
      <p>Für „ist nicht" aber schon — das Arabische braucht ein eigenes Wörtchen, um etwas zu
      bestreiten, das man sonst einfach nebeneinanderstellt.</p>` },
    { label:"Lektion", html:`
      <p><span class="ar">إِلَّا</span> heißt <i>außer</i>. Es macht aus einer Verneinung eine Ausnahme —
      und damit eine sehr starke Aussage.</p>
      <p class="cue">— und jetzt der Satz —</p>
      <p><span class="ar">لَا إِلٰهَ إِلَّا اللَّهُ</span> — <i>Kein Gott außer Allah.</i></p>` },
    { label:"Lektion", html:`
      <p><span class="ar">إِلٰه</span> heißt <i>Gott, Gottheit, das, was angebetet wird</i>.</p>
      <p>Erst wird
      alles verneint — <i>kein Gott</i> — und dann die eine Ausnahme gemacht. Deshalb ist der Satz so
      kraftvoll: er räumt erst ab und setzt dann.</p>` },
    { label:"Lektion", html:`
      <p>Und ein Vers, der euer <span class="ar">شَيۡء</span> aus Lektion 1 aufgreift:
      <span class="ar">لَيۡسَ كَمِثۡلِهِ شَيۡءٌ</span> — <i>Nichts ist Ihm gleich.</i></p>` },
    { label:"Lektion", html:`
      <p>Wörtlich: „Nicht ist wie Seinesgleichen ein Ding." Das <span class="ar">كَ</span> heißt
      <i>wie</i>, <span class="ar">مِثۡل</span> heißt <i>gleich</i>, und das <span class="ar">ـهِ</span>
      am Ende kennt ihr aus Lektion 7.</p>` },
    { label:"Abschluss", html:`
      <p>Verneinen und eine Ausnahme machen — damit versteht ihr die Schahāda Wort für Wort.</p>
      <p>Bis zum nächsten Mal. <span class="ar">وعليكم السلام ورحمة الله وبركاته</span></p>` }
  ],
  slides: [
    { s:0, html:`<div class="title">Quran verstehen lernen
        <span class="sub">Lektion 10</span></div>` },

    { s:1, html:`<div class="ar ar-l">ذٰلِكَ الۡكِتَابُ <span class="gold">لَا</span> رَيۡبَ فِيهِ</div>
      <div class="de step" data-step="1">Das لَا stand schon in Lektion 4 — heute nehmen wir es ernst.</div>` },

    { s:2, html:`<div class="rows">
        <div class="rowi"><div class="a">لَا</div><div class="b">kein · nein</div></div>
        <div class="rowi step" data-step="1"><div class="a">مَا</div><div class="b">nicht</div></div>
        <div class="rowi step" data-step="2"><div class="a">لَيۡسَ</div><div class="b">ist nicht</div></div>
        <div class="rowi step" data-step="3"><div class="a">إِلَّا</div><div class="b">außer</div></div>
      </div>` },

    { s:3, html:`<div class="ar ar-xl"><span class="gold">لَا</span> رَيۡبَ</div>
      <div class="de big step" data-step="1">kein Zweifel</div>` },

    { s:3, html:`<div class="kicker">Für „ist" gibt es kein Wort …</div>
      <div class="ar ar-l">هٰذَا سَبِيلٌ</div>
      <div class="de step" data-step="1">… für „ist nicht" aber schon.</div>
      <div class="de big step" data-step="2"><span class="ar ar-m"><span class="gold">لَيۡسَ</span> هٰذَا سَبِيلًا</span></div>` },

    { s:4, html:`<div class="vocab">
        <div class="vrow"><div class="emoji">🕋</div><div class="w ar">إِلٰه</div><div class="m">Gott · Gottheit</div></div>
      </div>` },

    { s:5, html:`<div class="ar ar-xl">لَا إِلٰهَ إِلَّا اللَّهُ</div>` },

    { s:6, html:`<div class="parse wide">
        <div class="cell"><div class="p-ar">لَا</div><div class="arrow">↓</div><div class="p-de">kein</div></div>
        <div class="cell"><div class="p-ar">إِلٰهَ</div><div class="arrow">↓</div><div class="p-de">Gott</div></div>
        <div class="cell"><div class="p-ar gold">إِلَّا</div><div class="arrow">↓</div><div class="p-de">außer</div></div>
        <div class="cell"><div class="p-ar">اللَّهُ</div><div class="arrow">↓</div><div class="p-de">Allah</div></div>
      </div>
      <div class="de big step" data-step="1">Kein Gott außer Allah.</div>` },

    { s:7, html:`<div class="kicker">Warum dieser Satz so kraftvoll ist</div>
      <div class="pair">
        <div class="col"><h5>erst</h5><div class="ar">لَا إِلٰهَ</div><div class="m">alles wird abgeräumt</div></div>
        <div class="col"><h5>dann</h5><div class="ar gold">إِلَّا اللَّهُ</div><div class="m">die eine Ausnahme</div></div>
      </div>` },

    { s:8, html:`<div class="kicker">Sure 42, Vers 11</div>
      <div class="ar ar-l">لَيۡسَ كَمِثۡلِهِ شَيۡءٌ</div>
      <div class="de big step" data-step="1">Nichts ist Ihm gleich.</div>` },

    { s:9, html:`<div class="parse wide">
        <div class="cell"><div class="p-ar">لَيۡسَ</div><div class="arrow">↓</div><div class="p-de">nicht ist</div></div>
        <div class="cell"><div class="p-ar">كَ</div><div class="arrow">↓</div><div class="p-de">wie</div></div>
        <div class="cell"><div class="p-ar">مِثۡلِ</div><div class="arrow">↓</div><div class="p-de">gleich</div></div>
        <div class="cell"><div class="p-ar">هِ</div><div class="arrow">↓</div><div class="p-de">ihm</div></div>
        <div class="cell"><div class="p-ar gold">شَيۡءٌ</div><div class="arrow">↓</div><div class="p-de">ein Ding</div></div>
      </div>
      <div class="de small step" data-step="1">Das شَيۡء aus Lektion 1 und das ـهِ aus Lektion 7.</div>` },

    { s:10, html:`<div class="rows">
        <div class="rowi"><div class="a">لَا</div><div class="b">kein</div></div>
        <div class="rowi"><div class="a">مَا</div><div class="b">nicht</div></div>
        <div class="rowi"><div class="a">لَيۡسَ</div><div class="b">ist nicht</div></div>
        <div class="rowi"><div class="a">إِلَّا</div><div class="b">außer</div></div>
      </div>
      <div class="de step" data-step="1"><span class="ar ar-m">لَا إِلٰهَ إِلَّا اللَّهُ</span></div>` },

    { s:10, html:`<div class="ar ar-l">وعليكم السلام ورحمة الله وبركاته</div>` }

  ]
};
</script>
