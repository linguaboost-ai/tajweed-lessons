const LESSON = {
  no: 17,
  thema: "إِنَّ und كَانَ",
  sections: [
    { label:"Begrüßung", html:`
      <p>Liebe Geschwister, <span class="ar">السلام عليكم ورحمة الله</span>!</p>
      <p>Willkommen zur siebzehnten Lektion.</p>` },
    { label:"Rückblick", html:`
      <p>In Lektion 13 stand <span class="ar">إِنَّا أَنْزَلْنَاهُ</span>.</p>
      <p>Dieses <span class="ar">إِنَّ</span> hole ich heute nach.</p>` },
    { label:"Die neuen Wörter", html:`
      <p class="ar">إِنَّ &nbsp; كَانَ</p>` },
    { label:"Lektion", html:`
      <p>Zwei Wörter, die einen fertigen Satz nehmen und ihn umbauen.</p>
      <p><span class="ar">إِنَّ</span> heißt <i>wahrlich, gewiss</i>. Es steht vorne und verstärkt die
      Aussage. Im Deutschen gibt es dafür kaum eine Entsprechung — man übersetzt es oft gar nicht,
      sondern hört es nur mit.</p>
      <p>Und es hinterlässt eine Spur: das Wort direkt danach bekommt ein <i>-a</i> statt des <i>-u</i>.</p>
      <p><span class="ar">اللَّهُ</span> → <span class="ar">إِنَّ اللَّهَ</span>.</p>
      <p><span class="ar">إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ</span> —
      <i>Wahrlich, Allah ist zu allem fähig.</i> Die Formel aus Lektion 6, nur verstärkt.</p>
      <p class="cue">— und das zweite Wort —</p>
      <p><span class="ar">كَانَ</span> heißt <i>er war</i>. Damit holt ihr einen Satz ohne Verb in die
      Vergangenheit.</p>
      <p><span class="ar">اللَّهُ غَفُورٌ رَحِيمٌ</span> — Allah ist vergebend und barmherzig.<br>
      <span class="ar">كَانَ اللَّهُ غَفُورًا رَحِيمًا</span> — Allah ist (immer schon) vergebend und
      barmherzig gewesen.</p>
      <p>Auch <span class="ar">كَانَ</span> hinterlässt eine Spur, nur an anderer Stelle: nicht beim
      ersten Wort, sondern bei der Eigenschaft dahinter — aus <span class="ar">غَفُورٌ</span> wird
      <span class="ar">غَفُورًا</span>.</p>
      <p>Und ein Vers zum Behalten:
      <span class="ar">إِنَّ مَعَ الْعُسْرِ يُسْرًا</span> — <i>Wahrlich, mit der Schwierigkeit kommt
      Erleichterung.</i> <span class="ar">مَعَ</span> heißt <i>mit</i>,
      <span class="ar">الْعُسْر</span> ist die Schwierigkeit, <span class="ar">يُسْر</span> die
      Erleichterung.</p>` },
    { label:"Abschluss", html:`
      <p>Zwei Wörter, die den Satz umstellen — und die ihr ab jetzt überall wiedererkennt.</p>
      <p>Bis zum nächsten Mal. <span class="ar">وعليكم السلام ورحمة الله وبركاته</span></p>` }
  ],
  slides: [
    { s:0, html:`<div class="title">Quran verstehen lernen

    { s:2, html:`<div class="rows">
        <div class="rowi"><div class="a">إِنَّ</div><div class="b">wahrlich · gewiss</div></div>
        <div class="rowi step" data-step="1"><div class="a">كَانَ</div><div class="b">er war</div></div>
      </div>` },

    { s:3, html:`<div class="kicker">Kaum übersetzbar</div>
      <div class="ar ar-xl gold">إِنَّ</div>
      <div class="de big step" data-step="1">wahrlich · gewiss</div>
      <div class="de small step" data-step="2">Man übersetzt es oft gar nicht — man hört es mit.</div>` },

    { s:3, html:`<div class="kicker">Es hinterlässt eine Spur</div>
      <div class="pair">
        <div class="col"><h5>allein</h5><div class="ar">اللَّهُ</div><div class="m">-u</div></div>
        <div class="col"><h5>nach إِنَّ</h5><div class="ar">إِنَّ اللَّهَ</div><div class="m">-a</div></div>
      </div>` },

    { s:3, html:`<div class="ar ar-l">إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ</div>
      <div class="de big step" data-step="1">Wahrlich, Allah ist zu allem fähig.</div>
      <div class="de small step" data-step="2">Die Formel aus Lektion 6 — nur verstärkt.</div>` },

    { s:3, html:`<div class="kicker">Und das zweite Wort</div>
      <div class="ar ar-xl gold">كَانَ</div>
      <div class="de big step" data-step="1">er war</div>` },

    { s:3, html:`<div class="pair">
        <div class="col"><h5>ohne Verb</h5><div class="ar">اللَّهُ غَفُورٌ</div><div class="m">Allah ist vergebend.</div></div>
        <div class="col"><h5>mit كَانَ</h5><div class="ar">كَانَ اللَّهُ غَفُورًا</div><div class="m">Allah ist es immer schon gewesen.</div></div>
      </div>` },

    { s:3, html:`<div class="kicker">Auch كَانَ hinterlässt eine Spur</div>
      <div class="glue">
        <div class="piece">غَفُورٌ</div><div class="plus">→</div><div class="piece gold">غَفُورًا</div>
      </div>
      <div class="de small step" data-step="1">Nicht beim ersten Wort — bei der Eigenschaft dahinter.</div>` },

    { s:3, html:`<div class="kicker">Sure 94, Vers 6</div>
      <div class="ar ar-l">إِنَّ مَعَ الْعُسْرِ يُسْرًا</div>
      <div class="de big step" data-step="1">Wahrlich, mit der Schwierigkeit kommt Erleichterung.</div>` },

    { s:3, html:`<div class="parse wide">
        <div class="cell"><div class="p-ar gold">إِنَّ</div><div class="arrow">↓</div><div class="p-de">wahrlich</div></div>
        <div class="cell"><div class="p-ar">مَعَ</div><div class="arrow">↓</div><div class="p-de">mit</div></div>
        <div class="cell"><div class="p-ar">الْعُسْرِ</div><div class="arrow">↓</div><div class="p-de">der Schwierigkeit</div></div>
        <div class="cell"><div class="p-ar">يُسْرًا</div><div class="arrow">↓</div><div class="p-de">Erleichterung</div></div>
      </div>` },

    { s:4, html:`<div class="rows">
        <div class="rowi"><div class="a">إِنَّ</div><div class="b">wahrlich — danach -a</div></div>
        <div class="rowi"><div class="a">كَانَ</div><div class="b">er war — danach -an</div></div>
      </div>
      <div class="de step" data-step="1">Zwei Wörter, die den ganzen Satz umstellen.</div>` },

    { s:4, html:`<div class="ar ar-l">وعليكم السلام ورحمة الله وبركاته</div>` }
  ]
};
