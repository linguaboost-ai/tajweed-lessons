const LESSON = {

    { label:"Begrüßung", html:`

    { label:"Rückblick", html:`

    { label:"Lektion", html:`
      <p>Unser Beispielwort heute: <span class="ar">رَبّ</span> — <i>Herr</i>. Es ist eines der häufigsten

      <p><span class="ar">رَبِّي</span> — mein Herr.<br>
      <span class="ar">رَبُّكَ</span> — dein Herr.<br>
      <span class="ar">رَبُّهُ</span> — sein Herr.</p>` },
    { label:"Lektion", html:`
      <p>Ihr seht: der Wortstamm bleibt stehen, nur das Ende wechselt. Das geht mit jedem Wort:

    { label:"Lektion", html:`

      <span class="ar">رَبُّهُمۡ</span> — ihr Herr.</p>
      <p>Und weil das Wort damit schon jemandem gehört, ist es automatisch bestimmt.</p>` },
    { label:"Lektion", html:`

    { label:"Lektion", html:`
      <p>Zum Schluss ein Satz aus der Geschichte Ibrahims, <span class="ar">عليه السلام</span>. Er blickt

      <p>Er sagt es,

      <p>Zwei Wörter — beide kennt ihr. Und schon ein Vers.</p>` },
    { label:"Abschluss", html:`

    { s:5, html:`<div class="rows">
        <div class="rowi"><div class="a">رَبِّ<span class="gold">ي</span></div><div class="b">mein Herr</div></div>

        <div class="rowi"><div class="a">رَبُّ<span class="gold">هُ</span></div><div class="b">sein Herr</div></div>
      </div>
      <div class="de small step" data-step="1">Der Stamm bleibt — nur das Ende wechselt.</div>` },

    { s:6, html:`<div class="kicker">Das geht mit jedem Wort</div>

        <div class="rowi"><div class="a">كِتَابِي</div><div class="b">mein Buch</div></div>
        <div class="rowi step" data-step="1"><div class="a">كِتَابُكَ</div><div class="b">dein Buch</div></div>
        <div class="rowi step" data-step="2"><div class="a">سَبِيلُهُ</div><div class="b">sein Weg</div></div>
      </div>` },

    { s:7, html:`<div class="kicker">Und in der Mehrzahl</div>
      <div class="rows">
        <div class="rowi"><div class="a">رَبُّ<span class="gold">نَا</span></div><div class="b">unser Herr</div></div>
        <div class="rowi step" data-step="1"><div class="a">رَبُّ<span class="gold">كُمۡ</span></div><div class="b">euer Herr</div></div>
        <div class="rowi step" data-step="2"><div class="a">رَبُّ<span class="gold">هُمۡ</span></div><div class="b">ihr Herr</div></div>
      </div>` },

    { s:7, html:`<div class="kicker">Wer besitzt, macht bestimmt</div>
      <div class="ar ar-l" style="opacity:.35;text-decoration:line-through">الۡرَبِّي</div>
      <div class="de step" data-step="1">wie „das mein Buch" — gibt es nicht</div>
      <div class="de big step" data-step="2"><span class="ar ar-m">رَبِّي</span> ist schon bestimmt.</div>` },

    { s:8, html:`<div class="kicker">Ibrahim, عليه السلام, blickt zum Himmel</div>

      <div class="de big step" data-step="1">Das ist mein Herr.</div>` },

    { s:9, html:`<div class="parse">

      <div class="de step" data-step="1">Er sagt es über einen Stern — und zeigt seinem Volk:
