const LESSON = {
  no: 18,
  thema: "Zeit und Bedingung",
  sections: [
    { label:"Begrüßung", html:`
      <p>Liebe Geschwister, <span class="ar">السلام عليكم ورحمة الله</span>!</p>
      <p>Willkommen zur achtzehnten Lektion.</p>` },
    { label:"Rückblick", html:`
      <p>Ihr habt Vergangenheit und Gegenwart.</p>
      <p>Heute kommen die Wörter, die sie verschieben.</p>` },
    { label:"Die neuen Wörter", html:`
      <p class="ar">قَدْ &nbsp; لَمْ &nbsp; لَنْ &nbsp; سَـ &nbsp; إِذَا</p>` },
    { label:"Lektion", html:`
      <p>Fünf kleine Wörter. Jedes steht vor dem Verb und verändert, wann etwas geschieht — oder ob
      überhaupt.</p>
      <p><span class="ar">قَدْ</span> vor einer Vergangenheit heißt <i>bereits, tatsächlich</i>. Es macht
      aus „sie waren erfolgreich" ein „sie sind es wirklich geworden".</p>
      <p><span class="ar">قَدْ أَفْلَحَ الْمُؤْمِنُونَ</span> — <i>Wahrlich, erfolgreich sind die
      Gläubigen.</i> Da steht euer Plural aus Lektion 11 und euer Verb aus Lektion 12.</p>
      <p class="cue">— und jetzt wird verneint —</p>
      <p><span class="ar">لَمْ</span> ist ein Trick: es steht vor der <b>Gegenwart</b>, verneint aber die
      <b>Vergangenheit</b>. <span class="ar">يَلِدُ</span> heißt <i>er zeugt</i>,
      <span class="ar">لَمْ يَلِدْ</span> heißt <i>er hat nicht gezeugt</i>.</p>
      <p>Ihr kennt den Vers: <span class="ar">لَمْ يَلِدْ وَلَمْ يُولَدْ</span> —
      <i>Er hat nicht gezeugt und wurde nicht gezeugt.</i></p>
      <p><span class="ar">لَنْ</span> verneint dagegen die Zukunft: <i>wird niemals</i>.</p>
      <p>Und die Zukunft selbst? Die ist am billigsten zu haben: ein <span class="ar">سَـ</span> vor das
      Gegenwartsverb, fertig. <span class="ar">يَعْلَمُ</span> (er weiß) →
      <span class="ar">سَيَعْلَمُ</span> (er wird wissen).</p>
      <p>Zuletzt <span class="ar">إِذَا</span> — <i>wenn, als</i>. Damit beginnt eine ganze Sure:</p>
      <p><span class="ar">إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ</span> —
      <i>Wenn die Hilfe Allahs kommt und der Sieg.</i></p>
      <p><span class="ar">جَاءَ</span> heißt <i>er kam</i>, <span class="ar">نَصْر</span> ist <i>Hilfe</i>,
      <span class="ar">الْفَتْح</span> ist <i>der Sieg</i>. Und <span class="ar">نَصْرُ اللَّهِ</span>
      ist wieder eine Iḍāfa — Lektion 9.</p>` },
    { label:"Abschluss", html:`
      <p>Fünf Wörter vor dem Verb — und die Zeit verschiebt sich.</p>
      <p>Bis zum nächsten Mal. <span class="ar">وعليكم السلام ورحمة الله وبركاته</span></p>` }
  ],
  slides: [
    { s:0, html:`<div class="title">Quran verstehen lernen

    { s:2, html:`<div class="rows">
        <div class="rowi"><div class="a">قَدْ</div><div class="b">bereits · tatsächlich</div></div>
        <div class="rowi step" data-step="1"><div class="a">لَمْ</div><div class="b">hat nicht</div></div>
        <div class="rowi step" data-step="2"><div class="a">لَنْ</div><div class="b">wird niemals</div></div>
        <div class="rowi step" data-step="3"><div class="a">سَـ</div><div class="b">wird</div></div>
        <div class="rowi step" data-step="4"><div class="a">إِذَا</div><div class="b">wenn · als</div></div>
      </div>` },

    { s:3, html:`<div class="kicker">Sure 23, Vers 1</div>
      <div class="ar ar-l">قَدْ أَفْلَحَ الْمُؤْمِنُونَ</div>
      <div class="de big step" data-step="1">Wahrlich, erfolgreich sind die Gläubigen.</div>` },

    { s:3, html:`<div class="parse wide">
        <div class="cell"><div class="p-ar gold">قَدْ</div><div class="arrow">↓</div><div class="p-de">wahrlich</div></div>
        <div class="cell"><div class="p-ar">أَفْلَحَ</div><div class="arrow">↓</div><div class="p-de">war erfolgreich</div></div>
        <div class="cell"><div class="p-ar">الْمُؤْمِنُونَ</div><div class="arrow">↓</div><div class="p-de">die Gläubigen</div></div>
      </div>
      <div class="de small step" data-step="1">Plural aus Lektion 11, Verb aus Lektion 12.</div>` },

    { s:3, html:`<div class="kicker">Ein Trick</div>
      <div class="de big">لَمْ steht vor der <b>Gegenwart</b> …</div>
      <div class="de big step" data-step="1">… verneint aber die <b>Vergangenheit</b>.</div>` },

    { s:3, html:`<div class="pair">
        <div class="col"><h5>ohne لَمْ</h5><div class="ar">يَلِدُ</div><div class="m">er zeugt</div></div>
        <div class="col"><h5>mit لَمْ</h5><div class="ar">لَمْ يَلِدْ</div><div class="m">er hat nicht gezeugt</div></div>
      </div>` },

    { s:3, html:`<div class="kicker">Sure 112, Vers 3</div>
      <div class="ar ar-l">لَمْ يَلِدْ وَلَمْ يُولَدْ</div>
      <div class="de big step" data-step="1">Er hat nicht gezeugt und wurde nicht gezeugt.</div>` },

    { s:3, html:`<div class="kicker">Die Zukunft ist billig zu haben</div>
      <div class="glue">
        <div class="piece gold">سَـ</div><div class="plus">+</div><div class="piece">يَعْلَمُ</div>
        <div class="plus">=</div><div class="piece">سَيَعْلَمُ</div>
      </div>
      <div class="de big step" data-step="1">er weiß → er wird wissen</div>` },

    { s:3, html:`<div class="pair">
        <div class="col"><h5>Zukunft</h5><div class="ar">سَيَعْلَمُ</div><div class="m">er wird wissen</div></div>
        <div class="col"><h5>Zukunft verneint</h5><div class="ar">لَنْ يَعْلَمَ</div><div class="m">er wird niemals wissen</div></div>
      </div>` },

    { s:3, html:`<div class="kicker">Sure 110, Vers 1</div>
      <div class="ar ar-l">إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ</div>
      <div class="de big step" data-step="1">Wenn die Hilfe Allahs kommt und der Sieg.</div>` },

    { s:3, html:`<div class="parse wide">
        <div class="cell"><div class="p-ar gold">إِذَا</div><div class="arrow">↓</div><div class="p-de">wenn</div></div>
        <div class="cell"><div class="p-ar">جَاءَ</div><div class="arrow">↓</div><div class="p-de">kam</div></div>
        <div class="cell"><div class="p-ar">نَصْرُ اللَّهِ</div><div class="arrow">↓</div><div class="p-de">die Hilfe Allahs</div></div>
        <div class="cell"><div class="p-ar">وَالْفَتْحُ</div><div class="arrow">↓</div><div class="p-de">und der Sieg</div></div>
      </div>
      <div class="de small step" data-step="1">نَصْرُ اللَّهِ — eine Iḍāfa, wie in Lektion 9.</div>` },

    { s:4, html:`<div class="rows">
        <div class="rowi"><div class="a">قَدْ</div><div class="b">bereits · tatsächlich</div></div>
        <div class="rowi"><div class="a">لَمْ &nbsp;·&nbsp; لَنْ</div><div class="b">hat nicht · wird niemals</div></div>
        <div class="rowi"><div class="a">سَـ</div><div class="b">wird</div></div>
        <div class="rowi"><div class="a">إِذَا</div><div class="b">wenn · als</div></div>
      </div>` },

    { s:4, html:`<div class="ar ar-l">وعليكم السلام ورحمة الله وبركاته</div>` }
  ]
};
