<title>Lektion 13 · Wer hat es getan? — Quran verstehen lernen</title>

<script>
/* =======================================================================
   LEKTIONSDATEN
   slide.s = Nummer der Transkriptbox (0 … sections.length-1)
   Jede Zeile mit class="step" data-step="1" erscheint erst beim
   nächsten Tastendruck.
   ======================================================================= */
const LESSON = {
  no: 13,
  thema: "Wer hat es getan?",
  sections: [
    { label:"Begrüßung", html:`
      <p>Liebe Geschwister, <span class="ar">السلام عليكم ورحمة الله</span>!</p>
      <p>Willkommen zur dreizehnten Lektion.</p>` },
    { label:"Rückblick", html:`
      <p><span class="ar">قَالَ</span> — er sagte. <span class="ar">قَالَتْ</span> — sie sagte.</p>
      <p>Und ich? Und wir?</p>` },
    { label:"Die neuen Wörter", html:`
      <p class="ar">ـْتُ &nbsp; ـْتَ &nbsp; ـْنَا &nbsp; ـُوا</p>` },
    { label:"Lektion", html:`
      <p>Im Deutschen ändert sich das Verb vorne und hinten: ich sag<b>e</b>, du sag<b>st</b>,
      wir sag<b>en</b>. Im Arabischen ändert sich in der Vergangenheit <b>nur das Ende</b>.
      Der Stamm bleibt, wie er ist.</p>
      <p>Nehmen wir <span class="ar">قَالَ</span> — er sagte:</p>
      <p><span class="ar">قُلْتُ</span> — ich sagte.<br>
      <span class="ar">قُلْتَ</span> — du sagtest.<br>
      <span class="ar">قَالُوا</span> — sie sagten.<br>
      <span class="ar">قُلْنَا</span> — wir sagten.</p>
      <p>Hört ihr das <span class="ar">ت</span> in „ich" und „du"? Das ist dasselbe <i>t</i> wie in
      <span class="ar">أَنْتَ</span>. Und das <span class="ar">ـنَا</span> ist dasselbe
      <span class="ar">نَا</span> wie in <span class="ar">رَبُّنَا</span> aus Lektion 7.</p>
      <p>Bei <span class="ar">قَالَ</span> verändert sich der Stamm ein wenig — aus dem langen <i>ā</i>
      wird ein kurzes <i>u</i>. Das passiert nur bei Verben mit einem <span class="ar">و</span> oder
      <span class="ar">ي</span> in der Mitte. Bei den meisten anderen bleibt alles glatt:
      <span class="ar">خَلَقْتُ</span>, <span class="ar">خَلَقْنَا</span>.</p>
      <p class="cue">— und damit versteht ihr einen ganzen Vers —</p>
      <p><span class="ar">إِنَّا أَنْزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ</span> —
      <i>Wir haben ihn herabgesandt in der Nacht der Bestimmung.</i></p>
      <p>Schaut es euch an: <span class="ar">أَنْزَلْ</span> ist das Verb aus Lektion 12.
      <span class="ar">ـنَا</span> ist das „wir" von heute. <span class="ar">ـهُ</span> ist das „ihn"
      aus Lektion 7. <span class="ar">فِي</span> ist Lektion 6. <span class="ar">لَيْلَة</span> ist
      Lektion 2. Und <span class="ar">لَيْلَةِ الْقَدْرِ</span> ist eine Iḍāfa aus Lektion 9.</p>
      <p>Ein Vers, sechs Lektionen.</p>` },
    { label:"Abschluss", html:`
      <p>Nur das Ende ändert sich — und plötzlich lest ihr Verse.</p>
      <p>Bis zum nächsten Mal. <span class="ar">وعليكم السلام ورحمة الله وبركاته</span></p>` }
  ],
  slides: [
    { s:0, html:`<div class="title">Quran verstehen lernen
        <span class="sub">Lektion 13 · Wer hat es getan?</span></div>` },

    { s:1, html:`<div class="pair">
        <div class="col"><h5>Deutsch</h5><div class="lat">ich sag<b>e</b><br>du sag<b>st</b></div><div class="m">vorne und hinten</div></div>
        <div class="col"><h5>Arabisch</h5><div class="ar">قُلْ<span class="gold">تُ</span></div><div class="m">nur hinten</div></div>
      </div>` },

    { s:2, html:`<div class="rows">
        <div class="rowi"><div class="a">ـْتُ</div><div class="b">ich</div></div>
        <div class="rowi step" data-step="1"><div class="a">ـْتَ</div><div class="b">du</div></div>
        <div class="rowi step" data-step="2"><div class="a">ـْنَا</div><div class="b">wir</div></div>
        <div class="rowi step" data-step="3"><div class="a">ـُوا</div><div class="b">sie (mehrere)</div></div>
      </div>` },

    { s:3, html:`<div class="kicker">Ein Stamm, vier Enden</div>
      <div class="rows">
        <div class="rowi"><div class="a">قَالَ</div><div class="b">er sagte</div></div>
        <div class="rowi step" data-step="1"><div class="a">قُلْ<span class="gold">تُ</span></div><div class="b">ich sagte</div></div>
        <div class="rowi step" data-step="2"><div class="a">قُلْ<span class="gold">تَ</span></div><div class="b">du sagtest</div></div>
        <div class="rowi step" data-step="3"><div class="a">قُلْ<span class="gold">نَا</span></div><div class="b">wir sagten</div></div>
        <div class="rowi step" data-step="4"><div class="a">قَالُ<span class="gold">وا</span></div><div class="b">sie sagten</div></div>
      </div>` },

    { s:3, html:`<div class="kicker">Alte Bekannte</div>
      <div class="pair">
        <div class="col"><h5>frei</h5><div class="ar">أَنْ<span class="gold">تَ</span></div><div class="ar step" data-step="1">رَبُّ<span class="gold">نَا</span></div></div>
        <div class="col"><h5>am Verb</h5><div class="ar">قُلْ<span class="gold">تَ</span></div><div class="ar step" data-step="1">قُلْ<span class="gold">نَا</span></div></div>
      </div>
      <div class="de small step" data-step="2">Dieselben Bausteine, an neuer Stelle.</div>` },

    { s:3, html:`<div class="kicker">Warum قَالَ zu قُلْ wird</div>
      <div class="pair">
        <div class="col"><h5>glatt</h5><div class="ar">خَلَقَ → خَلَقْتُ</div></div>
        <div class="col"><h5>mit و/ي in der Mitte</h5><div class="ar">قَالَ → قُلْتُ</div></div>
      </div>
      <div class="de small step" data-step="1">Aus dem langen <i>ā</i> wird ein kurzes <i>u</i>. Nur bei dieser Sorte Verben.</div>` },

    { s:3, html:`<div class="ar ar-l">خَلَقْنَا</div>
      <div class="de big step" data-step="1">wir erschufen</div>` },

    { s:3, html:`<div class="kicker">Sure 97, Vers 1</div>
      <div class="ar ar-l">إِنَّا أَنْزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ</div>` },

    { s:3, html:`<div class="parse wide">
        <div class="cell"><div class="p-ar">أَنْزَلْ</div><div class="arrow">↓</div><div class="p-de">herabsandt…</div></div>
        <div class="cell"><div class="p-ar gold">نَا</div><div class="arrow">↓</div><div class="p-de">wir</div></div>
        <div class="cell"><div class="p-ar">هُ</div><div class="arrow">↓</div><div class="p-de">ihn</div></div>
      </div>
      <div class="de big step" data-step="1">Wir haben ihn herabgesandt.</div>` },

    { s:3, html:`<div class="parse wide">
        <div class="cell"><div class="p-ar">فِي</div><div class="arrow">↓</div><div class="p-de">in</div></div>
        <div class="cell"><div class="p-ar">لَيْلَةِ</div><div class="arrow">↓</div><div class="p-de">der Nacht</div></div>
        <div class="cell"><div class="p-ar">الْقَدْرِ</div><div class="arrow">↓</div><div class="p-de">der Bestimmung</div></div>
      </div>
      <div class="de big step" data-step="1">in der Nacht der Bestimmung</div>` },

    { s:3, html:`<div class="kicker">Ein Vers, sechs Lektionen</div>
      <div class="rows">
        <div class="rowi"><div class="a">أَنْزَلَ</div><div class="b">Lektion 12</div></div>
        <div class="rowi"><div class="a">ـنَا</div><div class="b">Lektion 13</div></div>
        <div class="rowi"><div class="a">ـهُ</div><div class="b">Lektion 7</div></div>
        <div class="rowi"><div class="a">فِي</div><div class="b">Lektion 6</div></div>
        <div class="rowi"><div class="a">لَيْلَة</div><div class="b">Lektion 2</div></div>
        <div class="rowi"><div class="a">لَيْلَةِ الْقَدْرِ</div><div class="b">Lektion 9</div></div>
      </div>` },

    { s:4, html:`<div class="rows">
        <div class="rowi"><div class="a">قُلْتُ &nbsp;·&nbsp; قُلْتَ</div><div class="b">ich · du</div></div>
        <div class="rowi"><div class="a">قُلْنَا &nbsp;·&nbsp; قَالُوا</div><div class="b">wir · sie</div></div>
      </div>
      <div class="de step" data-step="1">Der Stamm bleibt — nur das Ende erzählt, wer gehandelt hat.</div>` },

    { s:4, html:`<div class="ar ar-l">وعليكم السلام ورحمة الله وبركاته</div>` }
  ]
};
</script>
