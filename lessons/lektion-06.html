<title>Lektion 6 · Kleine Wörter davor — Quran verstehen lernen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<div id="stage">
  <div id="bar"><span></span></div>
  <div id="meta"></div>

</div>

<script src="../assets/lessons.js"></script>
<script>
/* =======================================================================
   LEKTIONSDATEN
   slide.s = Nummer der Transkriptbox (0 … sections.length-1)
   Jede Zeile mit class="step" data-step="1" erscheint erst beim
   nächsten Tastendruck.
   ======================================================================= */
const LESSON = {
  no: 6,
  thema: "Kleine Wörter davor",
  sections: [
    { label:"Begrüßung", html:`
      <p>Liebe Geschwister, <span class="ar">السلام عليكم ورحمة الله</span>!</p>
      <p>Willkommen zur sechsten Lektion.</p>` },
    { label:"Rückblick", html:`
      <p>In Lektion 4 stand am Ende <span class="ar">فِيهِ</span> — <i>darin</i>.</p>
      <p>Heute schauen wir uns diese kleinen Wörter genauer an.</p>` },
    { label:"Die neuen Wörter", html:`
      <p class="ar">فِي &nbsp; مِنْ &nbsp; إِلَىٰ &nbsp; عَلَىٰ</p>` },
    { label:"Lektion", html:`
      <p>Vier Wörter, die im Quran auf fast jeder Seite stehen:</p>
      <p><span class="ar">فِي</span> — <i>in</i>. <span class="ar">مِنْ</span> — <i>von, aus</i>.
      <span class="ar">إِلَىٰ</span> — <i>zu, nach</i>. <span class="ar">عَلَىٰ</span> — <i>auf, über</i>.</p>` },
    { label:"Lektion", html:`
      <p>Sie stehen — wie im Deutschen — <b>vor</b> dem Wort, auf das sie sich beziehen.</p>
      <p class="cue">— und sie hinterlassen eine Spur —</p>
      <p>Im Deutschen ändert sich nach „mit" das Wort dahinter: aus „der Weg" wird „mit dem Weg".</p>` },
    { label:"Lektion", html:`
      <p>Im Arabischen passiert dasselbe, nur viel leiser — am Ende erscheint ein <i>i</i>, die Kasra.</p>
      <p><span class="ar">الْكِتَابُ</span> — das Buch. Aber: <span class="ar">فِي الْكِتَابِ</span> —
      im Buch. Das <i>-u</i> wird zum <i>-i</i>.</p>` },
    { label:"Lektion", html:`
      <p>Bei unbestimmten Wörtern wird aus dem <i>-un</i> ein <i>-in</i>:
      <span class="ar">كِتَابٌ</span> → <span class="ar">فِي كِتَابٍ</span>.</p>
      <p>Zwei neue Wörter zum Üben: <span class="ar">الْأَرْض</span> — die Erde.
      <span class="ar">السَّمَاء</span> — der Himmel.</p>` },
    { label:"Lektion", html:`
      <p><span class="ar">فِي الْأَرْضِ</span> — auf der Erde.
      <span class="ar">مِنَ السَّمَاءِ</span> — vom Himmel.</p>
      <p>Aufgepasst bei <span class="ar">مِنْ</span>: trifft es auf ein <span class="ar">الْ</span>,
      bekommt es zum leichteren Sprechen ein <i>a</i>: <i>mina s-samā'i</i>.</p>` },
    { label:"Lektion", html:`
      <p>Und eine Formel, die ihr ab heute versteht:
      <span class="ar">عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ</span> — <i>zu allem fähig</i>.</p>` },
    { label:"Lektion", html:`
      <p>Da steckt euer <span class="ar">شَيْء</span> aus Lektion 1 drin — mit einem <i>-in</i> am Ende,
      genau wie gelernt.</p>` },
    { label:"Abschluss", html:`
      <p>Vier kleine Wörter, eine Spur am Wortende. Ab jetzt seht ihr sie überall.</p>
      <p>Bis zum nächsten Mal. <span class="ar">وعليكم السلام ورحمة الله وبركاته</span></p>` }
  ],
  slides: [
    { s:0, html:`<div class="title">Quran verstehen lernen
        <span class="sub">Lektion 6 · Kleine Wörter davor</span></div>` },

    { s:1, html:`<div class="ar ar-l">ذٰلِكَ الْكِتَابُ لَا رَيْبَ <span class="gold">فِيهِ</span></div>
      <div class="de step" data-step="1">… kein Zweifel <b>darin</b>.</div>` },

    { s:2, html:`<div class="vocab">
        <div class="vrow"><div class="emoji">📥</div><div class="w ar">فِي</div><div class="m">in</div></div>
        <div class="vrow step" data-step="1"><div class="emoji">↩️</div><div class="w ar">مِنْ</div><div class="m">von · aus</div></div>
        <div class="vrow step" data-step="2"><div class="emoji">➡️</div><div class="w ar">إِلَىٰ</div><div class="m">zu · nach</div></div>
        <div class="vrow step" data-step="3"><div class="emoji">⬆️</div><div class="w ar">عَلَىٰ</div><div class="m">auf · über</div></div>
      </div>` },

    { s:3, html:`<div class="kicker">Sie hinterlassen eine Spur</div>
      <div class="pair">
        <div class="col"><h5>allein</h5><div class="ar">الْكِتَابُ</div><div class="m">al-kitāb<b>u</b></div></div>
        <div class="col"><h5>nach فِي</h5><div class="ar">فِي الْكِتَابِ</div><div class="m">fi l-kitāb<b>i</b></div></div>
      </div>
      <div class="de small step" data-step="1">Aus dem <i>-u</i> wird ein <i>-i</i>. Das ist alles.</div>` },

    { s:3, html:`<div class="pair">
        <div class="col"><h5>bestimmt</h5><div class="ar">فِي الْكِتَابِ</div><div class="m">im Buch</div></div>
        <div class="col"><h5>unbestimmt</h5><div class="ar">فِي كِتَابٍ</div><div class="m">in einem Buch</div></div>
      </div>
      <div class="de small step" data-step="1">-un wird zu -in, -u wird zu -i.</div>` },

    { s:4, html:`<div class="vocab">
        <div class="vrow"><div class="emoji">🌍</div><div class="w ar">الْأَرْض</div><div class="m">die Erde</div></div>
        <div class="vrow step" data-step="1"><div class="emoji">☁️</div><div class="w ar">السَّمَاء</div><div class="m">der Himmel</div></div>
      </div>` },

    { s:5, html:`<div class="ar ar-l">فِي الْأَرْضِ</div>
      <div class="de big step" data-step="1">auf der Erde</div>` },

    { s:6, html:`<div class="ar ar-l">مِنَ السَّمَاءِ</div>
      <div class="de big step" data-step="1">vom Himmel</div>
      <div class="de small step" data-step="2">مِنْ wird vor الْ zu مِنَ — nur damit es leichter über die Zunge geht.</div>` },

    { s:6, html:`<div class="ar ar-l">إِلَى اللَّهِ</div>
      <div class="de big step" data-step="1">zu Allah</div>` },

    { s:7, html:`<div class="kicker">Ein Baustein, den ihr schon kanntet</div>
      <div class="glue">
        <div class="piece">فِي</div><div class="plus">+</div><div class="piece">هِ</div>
        <div class="plus">=</div><div class="piece gold">فِيهِ</div>
      </div>
      <div class="de big step" data-step="1">in + ihm = darin</div>` },

    { s:8, html:`<div class="ar ar-l">عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ</div>
      <div class="de big step" data-step="1">zu allem fähig</div>` },

    { s:9, html:`<div class="parse wide">
        <div class="cell"><div class="p-ar">عَلَىٰ</div><div class="arrow">↓</div><div class="p-de">über</div></div>
        <div class="cell"><div class="p-ar">كُلِّ</div><div class="arrow">↓</div><div class="p-de">jedes</div></div>
        <div class="cell"><div class="p-ar gold">شَيْءٍ</div><div class="arrow">↓</div><div class="p-de">Ding</div></div>
        <div class="cell"><div class="p-ar">قَدِيرٌ</div><div class="arrow">↓</div><div class="p-de">mächtig</div></div>
      </div>
      <div class="de small step" data-step="1">Euer شَيْء aus Lektion 1 — mit dem <i>-in</i> von heute.</div>` },

    { s:10, html:`<div class="rows">
        <div class="rowi"><div class="a">فِي</div><div class="b">in</div></div>
        <div class="rowi"><div class="a">مِنْ</div><div class="b">von · aus</div></div>
        <div class="rowi"><div class="a">إِلَىٰ</div><div class="b">zu · nach</div></div>
        <div class="rowi"><div class="a">عَلَىٰ</div><div class="b">auf · über</div></div>
      </div>
      <div class="de step" data-step="1">Danach: <span class="gold">-i</span> statt <span>-u</span></div>` },

    { s:10, html:`<div class="ar ar-l">وعليكم السلام ورحمة الله وبركاته</div>` }

  ]
};
</script>

</html>
