/* =======================================================================
   LEKTIONSDATEN
   slide.s = Nummer der Transkriptbox (0 … sections.length-1)
   Jede Zeile mit class="step" data-step="1" erscheint erst beim
   nächsten Tastendruck.

const LESSON = {
  no: 11,
  thema: "Mehr als eins",
  sections: [
    { label:"Begrüßung", html:`
      <p>Liebe Geschwister, <span class="ar">السلام عليكم ورحمة الله</span>!</p>
      <p>Willkommen zur elften Lektion.</p>` },
    { label:"Rückblick", html:`
      <p><span class="ar">رَبُّ الْعَالَمِينَ</span> — der Herr der <b>Welten</b>.</p>
      <p>Da steckte schon eine Mehrzahl drin.</p>` },
    { label:"Die neuen Wörter", html:`
      <p class="ar">مُسْلِمُونَ &nbsp; مُسْلِمَات &nbsp; رُسُل</p>` },
    { label:"Lektion", html:`
      <p>Im Deutschen hängen wir meistens etwas an: Buch → Bücher, Weg → Wege. Das Arabische kennt drei
      Wege — zwei davon sind angehängt, einer baut das Wort von innen um.</p>` },
    { label:"Lektion", html:`
      <p><b>Erstens</b>, der männliche Plural: an das Wort kommt <span class="ar">ـُونَ</span>.
      <span class="ar">مُسْلِم</span> (ein Muslim) → <span class="ar">مُسْلِمُونَ</span> (Muslime).</p>` },
    { label:"Lektion", html:`
      <p>Nach den kleinen Wörtern aus Lektion 6 wird daraus <span class="ar">ـِينَ</span>:
      <span class="ar">مُسْلِمِينَ</span>. Dieselbe Spur wie damals — nur lauter.</p>
      <p>Genau das ist bei <span class="ar">الْعَالَمِينَ</span> passiert:
      <span class="ar">عَالَم</span> ist eine Welt, <span class="ar">عَالَمِينَ</span> sind die Welten.</p>` },
    { label:"Lektion", html:`
      <p><b>Zweitens</b>, der weibliche Plural: an das Wort kommt <span class="ar">ـَات</span>.
      <span class="ar">مُسْلِمَة</span> → <span class="ar">مُسْلِمَات</span>.</p>
      <p>Und <span class="ar">آيَة</span> aus Lektion 2 → <span class="ar">آيَات</span>, Zeichen, Verse.
      Beachtet: das <span class="ar">ة</span> weicht dem <span class="ar">ات</span>.</p>` },
    { label:"Lektion", html:`
      <p class="cue">— und jetzt der dritte Weg —</p>
      <p><b>Drittens</b>, der gebrochene Plural. Hier wird das Wort von innen umgebaut, wie im Deutschen
      bei Mutter → Mütter, nur viel gründlicher:</p>` },
    { label:"Lektion", html:`
      <p><span class="ar">كِتَاب</span> → <span class="ar">كُتُب</span>, Bücher.<br>
      <span class="ar">رَسُول</span> (ein Gesandter) → <span class="ar">رُسُل</span>, Gesandte.<br>
      <span class="ar">سَبِيل</span> → <span class="ar">سُبُل</span>, Wege.</p>` },
    { label:"Lektion", html:`
      <p>Diese Formen muss man lernen wie Vokabeln. Die gute Nachricht: es sind nur eine Handvoll Muster,
      und ihr werdet sie schnell wiedererkennen.</p>` },
    { label:"Abschluss", html:`
      <p>Zweimal angehängt, einmal von innen umgebaut. Und <span class="ar">الْعَالَمِينَ</span> ist
      ab heute kein Rätsel mehr.</p>` },
    { label:"Abschluss", html:`
      <p>Bis zum nächsten Mal. <span class="ar">وعليكم السلام ورحمة الله وبركاته</span></p>` }
  ],
  slides: [
    { s:0, html:`<div class="title">Quran verstehen lernen
        <span class="sub">Lektion 11 · Mehr als eins</span></div>` },

    { s:1, html:`<div class="ar ar-l">رَبُّ الْعَالَمِ<span class="gold">ينَ</span></div>
      <div class="de step" data-step="1">der Herr der <b>Welten</b> — Mehrzahl</div>` },

    { s:2, html:`<div class="kicker">Drei Wege zum Plural</div>
      <div class="rows">
        <div class="rowi"><div class="a">مُسْلِمُونَ</div><div class="b">angehängt (m.)</div></div>
        <div class="rowi step" data-step="1"><div class="a">مُسْلِمَات</div><div class="b">angehängt (w.)</div></div>
        <div class="rowi step" data-step="2"><div class="a">رُسُل</div><div class="b">von innen umgebaut</div></div>
      </div>` },

    { s:3, html:`<div class="kicker">Weg 1 — männlich</div>
      <div class="glue">
        <div class="piece">مُسْلِم</div><div class="plus">+</div><div class="piece gold">ُونَ</div>
      </div>
      <div class="de big step" data-step="1"><span class="ar ar-m">مُسْلِمُونَ</span> &nbsp;—&nbsp; Muslime</div>` },

    { s:3, html:`<div class="kicker">Dieselbe Spur wie in Lektion 6</div>
      <div class="pair">
        <div class="col"><h5>allein</h5><div class="ar">مُسْلِمُونَ</div><div class="m">-ūna</div></div>
        <div class="col"><h5>nach مِنْ, فِي …</h5><div class="ar">مُسْلِمِينَ</div><div class="m">-īna</div></div>
      </div>` },

    { s:4, html:`<div class="glue">
        <div class="piece">عَالَم</div><div class="plus">→</div><div class="piece gold">عَالَمِينَ</div>
      </div>
      <div class="de big step" data-step="1">eine Welt → die Welten</div>
      <div class="de small step" data-step="2">Das Rätsel aus Lektion 9 ist gelöst.</div>` },

    { s:5, html:`<div class="kicker">Weg 2 — weiblich</div>
      <div class="glue">
        <div class="piece">مُسْلِمَة</div><div class="plus">→</div><div class="piece gold">مُسْلِمَات</div>
      </div>
      <div class="de small step" data-step="1">Das ة weicht dem ات.</div>` },

    { s:6, html:`<div class="glue">
        <div class="piece">آيَة</div><div class="plus">→</div><div class="piece gold">آيَات</div>
      </div>
      <div class="de big step" data-step="1">ein Zeichen → Zeichen, Verse</div>` },

    { s:7, html:`<div class="kicker">Weg 3 — von innen umgebaut</div>
      <div class="pair">
        <div class="col"><h5>Deutsch</h5><div class="lat">Mutter<br>Mütter</div></div>
        <div class="col"><h5>Arabisch</h5><div class="ar">كِتَاب</div><div class="ar gold">كُتُب</div></div>
      </div>` },

    { s:8, html:`<div class="rows">
        <div class="rowi"><div class="a">كِتَاب &nbsp;→&nbsp; <span class="gold">كُتُب</span></div><div class="b">Buch → Bücher</div></div>
        <div class="rowi step" data-step="1"><div class="a">رَسُول &nbsp;→&nbsp; <span class="gold">رُسُل</span></div><div class="b">Gesandter → Gesandte</div></div>
        <div class="rowi step" data-step="2"><div class="a">سَبِيل &nbsp;→&nbsp; <span class="gold">سُبُل</span></div><div class="b">Weg → Wege</div></div>
      </div>` },

    { s:9, html:`<div class="de big">Diese Formen lernt man wie Vokabeln.</div>
      <div class="de step" data-step="1">Es sind nur eine Handvoll Muster — ihr werdet sie schnell wiedererkennen.</div>` },

    { s:10, html:`<div class="rows">
        <div class="rowi"><div class="a">ـُونَ &nbsp;/&nbsp; ـِينَ</div><div class="b">Plural männlich</div></div>
        <div class="rowi"><div class="a">ـَات</div><div class="b">Plural weiblich</div></div>
        <div class="rowi"><div class="a">كُتُب &nbsp;·&nbsp; رُسُل</div><div class="b">gebrochener Plural</div></div>
      </div>` },

    { s:11, html:`<div class="ar ar-l">وعليكم السلام ورحمة الله وبركاته</div>` }

  ]
};
</script>
