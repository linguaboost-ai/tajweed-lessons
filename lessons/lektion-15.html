<title>Lektion 15 · Der Befehl — Quran verstehen lernen</title>

<script>
/* =======================================================================
   LEKTIONSDATEN
   slide.s = Nummer der Transkriptbox (0 … sections.length-1)
   Jede Zeile mit class="step" data-step="1" erscheint erst beim
   nächsten Tastendruck.
   ======================================================================= */
const LESSON = {
  no: 15,
  thema: "Der Befehl",
  sections: [
    { label:"Begrüßung", html:`
      <p>Liebe Geschwister, <span class="ar">السلام عليكم ورحمة الله</span>!</p>
      <p>Willkommen zur fünfzehnten Lektion.</p>` },
    { label:"Rückblick", html:`
      <p>In Lektion 8 stand ein Wort, das ich euch schuldig geblieben bin:
      <span class="ar">قُلْ</span>.</p>` },
    { label:"Die neuen Wörter", html:`
      <p class="ar">قُلْ &nbsp; اقْرَأْ &nbsp; اهْدِنَا</p>` },
    { label:"Lektion", html:`
      <p>Der Befehl ist im Arabischen die kürzeste Form überhaupt. Man nimmt die Gegenwart, streicht den
      Buchstaben vorne weg — und fertig.</p>
      <p><span class="ar">تَقُولُ</span> (du sagst) → <span class="ar">قُلْ</span> (sag!).</p>
      <p>Bleibt danach ein schwer sprechbarer Anfang übrig, setzt man vorne ein kleines
      <span class="ar">ا</span> davor, nur als Anlauf: <span class="ar">تَقْرَأُ</span> (du liest) →
      <span class="ar">اقْرَأْ</span> (lies!).</p>
      <p class="cue">— und das ist das erste Wort des Qurans —</p>
      <p><span class="ar">اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ</span> —
      <i>Lies im Namen deines Herrn, der erschuf.</i></p>
      <p>Ihr kennt fast alles: <span class="ar">بِ</span> ist ein kleines Wort davor wie in Lektion 6,
      es heißt <i>mit, in</i>. <span class="ar">اسْم</span> heißt <i>Name</i> — zusammen eine Iḍāfa aus
      Lektion 9. <span class="ar">رَبِّكَ</span> ist <i>dein Herr</i> aus Lektion 7. Und
      <span class="ar">خَلَقَ</span> ist das Verb aus Lektion 12.</p>
      <p>Sind mehrere gemeint, kommt hinten ein <span class="ar">ـُوا</span> dazu, wie in Lektion 13:
      <span class="ar">اعْبُدُوا</span> — <i>dient!</i></p>
      <p>Und wenn ein Befehl an jemanden gerichtet wird, hängt man das Ziel einfach an:
      <span class="ar">اهْدِ</span> heißt <i>leite!</i>, <span class="ar">اهْدِنَا</span> heißt
      <i>leite uns!</i> — dasselbe <span class="ar">نَا</span> wie immer.</p>
      <p>Damit lest ihr den sechsten Vers der Fātiḥa:
      <span class="ar">اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ</span> — <i>Leite uns den geraden Weg.</i>
      Und schaut genau hin: <span class="ar">الصِّرَاطَ</span> mit <span class="ar">الْ</span>,
      <span class="ar">الْمُسْتَقِيمَ</span> mit <span class="ar">الْ</span> — die Eigenschaft macht
      mit, ganz wie in Lektion 5.</p>` },
    { label:"Abschluss", html:`
      <p>Vorne weg, und der Befehl steht. Kürzer geht es nicht.</p>
      <p>Bis zum nächsten Mal. <span class="ar">وعليكم السلام ورحمة الله وبركاته</span></p>` }
  ],
  slides: [
    { s:0, html:`<div class="title">Quran verstehen lernen
        <span class="sub">Lektion 15 · Der Befehl</span></div>` },

    { s:1, html:`<div class="ar ar-l"><span class="gold">قُلْ</span> هُوَ اللَّهُ أَحَدٌ</div>
      <div class="de step" data-step="1">Dieses قُلْ nehmen wir heute auseinander.</div>` },

    { s:2, html:`<div class="vocab">
        <div class="vrow"><div class="emoji">🗣️</div><div class="w ar">قُلْ</div><div class="m">sag!</div></div>
        <div class="vrow step" data-step="1"><div class="emoji">📖</div><div class="w ar">اقْرَأْ</div><div class="m">lies!</div></div>
        <div class="vrow step" data-step="2"><div class="emoji">🧭</div><div class="w ar">اهْدِنَا</div><div class="m">leite uns!</div></div>
      </div>` },

    { s:3, html:`<div class="kicker">Vorne weg — fertig</div>
      <div class="glue">
        <div class="piece" style="opacity:.3">تَ</div><div class="piece">قُولُ</div>
        <div class="plus">→</div><div class="piece gold">قُلْ</div>
      </div>
      <div class="de big step" data-step="1">du sagst → sag!</div>` },

    { s:3, html:`<div class="kicker">Und wenn der Rest stolpert?</div>
      <div class="glue">
        <div class="piece" style="opacity:.3">تَ</div><div class="piece">قْرَأُ</div>
        <div class="plus">→</div><div class="piece"><span class="gold">ا</span>قْرَأْ</div>
      </div>
      <div class="de small step" data-step="1">Ein kleines ا vorne, nur als Anlauf.</div>` },

    { s:3, html:`<div class="kicker">Das erste Wort des Qurans</div>
      <div class="ar ar-xl gold">اقْرَأْ</div>
      <div class="de big step" data-step="1">Lies!</div>` },

    { s:3, html:`<div class="ar ar-l">اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ</div>
      <div class="de big step" data-step="1">Lies im Namen deines Herrn, der erschuf.</div>` },

    { s:3, html:`<div class="parse wide">
        <div class="cell"><div class="p-ar gold">اقْرَأْ</div><div class="arrow">↓</div><div class="p-de">Lektion 15</div></div>
        <div class="cell"><div class="p-ar">بِاسْمِ</div><div class="arrow">↓</div><div class="p-de">Lektion 6 + 9</div></div>
        <div class="cell"><div class="p-ar">رَبِّكَ</div><div class="arrow">↓</div><div class="p-de">Lektion 7</div></div>
        <div class="cell"><div class="p-ar">خَلَقَ</div><div class="arrow">↓</div><div class="p-de">Lektion 12</div></div>
      </div>` },

    { s:3, html:`<div class="kicker">An mehrere</div>
      <div class="glue">
        <div class="piece">اعْبُدْ</div><div class="plus">+</div><div class="piece gold">وا</div>
        <div class="plus">=</div><div class="piece">اعْبُدُوا</div>
      </div>
      <div class="de big step" data-step="1">diene! → dient!</div>` },

    { s:3, html:`<div class="glue">
        <div class="piece">اهْدِ</div><div class="plus">+</div><div class="piece gold">نَا</div>
        <div class="plus">=</div><div class="piece">اهْدِنَا</div>
      </div>
      <div class="de big step" data-step="1">leite! → leite <b>uns</b>!</div>` },

    { s:3, html:`<div class="kicker">Sure 1, Vers 6</div>
      <div class="ar ar-l">اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ</div>
      <div class="de big step" data-step="1">Leite uns den geraden Weg.</div>` },

    { s:3, html:`<div class="kicker">Schaut genau hin</div>
      <div class="ar ar-l"><span class="gold">ال</span>صِّرَاطَ <span class="gold">ال</span>ْمُسْتَقِيمَ</div>
      <div class="de step" data-step="1">Beide mit الْ — die Eigenschaft macht mit.</div>
      <div class="de small step" data-step="2">Genau wie in Lektion 5 gelernt.</div>` },

    { s:4, html:`<div class="rows">
        <div class="rowi"><div class="a">قُلْ</div><div class="b">sag!</div></div>
        <div class="rowi"><div class="a">اقْرَأْ</div><div class="b">lies!</div></div>
        <div class="rowi"><div class="a">اعْبُدُوا</div><div class="b">dient!</div></div>
        <div class="rowi"><div class="a">اهْدِنَا</div><div class="b">leite uns!</div></div>
      </div>` },

    { s:4, html:`<div class="ar ar-l">وعليكم السلام ورحمة الله وبركاته</div>` }
  ]
};
</script>
