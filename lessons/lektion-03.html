<title>Lektion 3 · Der Artikel الـ — Quran verstehen lernen</title>

<script>
/* =======================================================================
   LEKTIONSDATEN
   slide.s = Nummer der Transkriptbox (0 … sections.length-1)
   Jede Zeile mit class="step" data-step="1" erscheint erst beim
   nächsten Tastendruck.
   ======================================================================= */
const LESSON = {
  no: 3,
  thema: "Der Artikel الـ",
  sections: [
    { label:"Begrüßung", html:`
      <p>Liebe Geschwister, <span class="ar">السلام عليكم ورحمة الله</span>!</p>
      <p>Willkommen zur dritten Lektion.</p>` },
    { label:"Rückblick", html:`
      <p>Wir können sagen: <span class="ar">هٰذَا سَبِيلٌ</span> — Das ist <b>ein</b> Weg.</p>
      <p>Heute lernen wir das Wörtchen für <b>der, die, das</b>.</p>` },
    { label:"Die neuen Wörter", html:`
      <p class="ar">الْكِتَاب &nbsp; الْحَقّ &nbsp; النَّاس</p>` },
    { label:"Lektion", html:`
      <p>Im Deutschen haben wir drei Wörter für die Bestimmtheit: der, die, das. Im Arabischen gibt es
      nur eines — und es ist für alles gleich: <span class="ar">الْ</span>.</p>
      <p>Es steht nicht daneben, sondern wird vorne angeklebt:
      <span class="ar">كِتَاب</span> (ein Buch) → <span class="ar">الْكِتَاب</span> (das Buch).</p>
      <p class="cue">— achtet auf das Ende —</p>
      <p>Bei <span class="ar">كِتَابٌ</span> steht am Ende ein doppeltes u, ein sogenanntes
      <i>Tanwīn</i>: das <i>-un</i>. Genau dieses <i>-n</i> ist das arabische „ein". Setzt man
      <span class="ar">الْ</span> davor, fällt es weg: <span class="ar">الْكِتَابُ</span>.</p>
      <p>Entweder das eine oder das andere — niemals beides.</p>
      <p>Zwei weitere Wörter: <span class="ar">الْحَقّ</span> — die Wahrheit, das Wahre. Und
      <span class="ar">النَّاس</span> — die Menschen.</p>
      <p>Bei <span class="ar">النَّاس</span> hört ihr das <i>l</i> gar nicht. Vor etwa der Hälfte der
      Buchstaben verschwindet es und der folgende Buchstabe verdoppelt sich: <i>an-nās</i>, nicht
      <i>al-nās</i>. Man nennt sie Sonnenbuchstaben — nach <span class="ar">الشَّمْس</span>, <i>asch-schams</i>,
      die Sonne. Bei den übrigen, den Mondbuchstaben, bleibt das <i>l</i> hörbar:
      <span class="ar">الْقَمَر</span>, <i>al-qamar</i>, der Mond.</p>
      <p class="cue">— eine wichtige Stolperfalle —</p>
      <p><span class="ar">هٰذَا كِتَابٌ</span> ist ein Satz: Das ist ein Buch.<br>
      <span class="ar">هٰذَا الْكِتَابُ</span> ist <b>kein</b> Satz, sondern nur eine Wortgruppe:
      <i>dieses Buch</i>.</p>
      <p>Will man sagen „Das ist das Buch", schiebt man ein <span class="ar">هُوَ</span> (er/es) dazwischen:
      <span class="ar">هٰذَا هُوَ الْكِتَابُ</span>. Mehr dazu in einer späteren Lektion.</p>` },
    { label:"Abschluss", html:`
      <p>Ein Wort für alle Geschlechter, vorne angeklebt, und das Tanwīn muss weichen.</p>
      <p>Bis zum nächsten Mal. <span class="ar">وعليكم السلام ورحمة الله وبركاته</span></p>` }
  ],
  slides: [
    { s:0, html:`<div class="title">Quran verstehen lernen
        <span class="sub">Lektion 3 · Der Artikel الـ</span></div>` },

    { s:1, html:`<div class="pair">
        <div class="col"><h5>bisher</h5><div class="ar">كِتَابٌ</div><div class="m">ein Buch</div></div>
        <div class="col"><h5>heute</h5><div class="ar gold">الْكِتَابُ</div><div class="m">das Buch</div></div>
      </div>` },

    { s:2, html:`<div class="vocab">
        <div class="vrow"><div class="emoji">📖</div><div class="w ar">الْكِتَاب</div><div class="m"></div></div>
        <div class="vrow step" data-step="1"><div class="emoji">⚖️</div><div class="w ar">الْحَقّ</div><div class="m"></div></div>
        <div class="vrow step" data-step="2"><div class="emoji">👥</div><div class="w ar">النَّاس</div><div class="m"></div></div>
      </div>` },

    { s:3, html:`<div class="kicker">Drei Wörter — oder eines</div>
      <div class="pair">
        <div class="col"><h5>Deutsch</h5><div class="lat">der<br>die<br>das</div></div>
        <div class="col"><h5>Arabisch</h5><div class="ar gold ar-l">الْ</div></div>
      </div>` },

    { s:3, html:`<div class="glue">
        <div class="piece gold">الْ</div><div class="plus">+</div><div class="piece">كِتَاب</div>
      </div>
      <div class="de big step" data-step="1"><span class="ar ar-l"><span class="gold">الْ</span>كِتَاب</span></div>` },

    { s:3, html:`<div class="kicker">Das eine schließt das andere aus</div>
      <div class="pair">
        <div class="col"><h5>ein Buch</h5><div class="ar">كِتَاب<span class="gold">ٌ</span></div><div class="m">kitāb<b>un</b></div></div>
        <div class="col"><h5>das Buch</h5><div class="ar"><span class="gold">الْ</span>كِتَابُ</div><div class="m"><b>al</b>-kitābu</div></div>
      </div>
      <div class="de small step" data-step="1">Das <i>-n</i> am Ende ist das arabische „ein". Mit الْ fällt es weg.</div>` },

    { s:3, html:`<div class="vocab">
        <div class="vrow"><div class="emoji">⚖️</div><div class="w ar">الْحَقّ</div><div class="m">die Wahrheit</div></div>
      </div>` },

    { s:3, html:`<div class="vocab">
        <div class="vrow"><div class="emoji">👥</div><div class="w ar">النَّاس</div><div class="m">die Menschen</div></div>
      </div>
      <div class="de small step" data-step="1">gesprochen: <i>an-nās</i> — wo ist das <i>l</i> hin?</div>` },

    { s:3, html:`<div class="kicker">Sonne und Mond</div>
      <div class="pair">
        <div class="col"><h5>Sonnenbuchstabe</h5><div class="ar">الشَّمْس</div><div class="m">asch-schams · die Sonne</div></div>
        <div class="col"><h5>Mondbuchstabe</h5><div class="ar">الْقَمَر</div><div class="m">al-qamar · der Mond</div></div>
      </div>
      <div class="de small step" data-step="1">Vor etwa der Hälfte der Buchstaben verstummt das <i>l</i> — der nächste Buchstabe verdoppelt sich.</div>` },

    { s:3, html:`<div class="kicker">Achtung, Stolperfalle</div>
      <div class="rows">
        <div class="rowi"><div class="a">هٰذَا كِتَابٌ</div><div class="b">Das ist ein Buch. &nbsp;— ein Satz</div></div>
        <div class="rowi step" data-step="1"><div class="a">هٰذَا الْكِتَابُ</div><div class="b">dieses Buch &nbsp;— kein Satz</div></div>
      </div>` },

    { s:3, html:`<div class="ar ar-l">هٰذَا <span class="gold">هُوَ</span> الْكِتَابُ</div>
      <div class="de big step" data-step="1">Das ist das Buch.</div>
      <div class="de small step" data-step="2">Ein eingeschobenes <span class="ar">هُوَ</span> (er/es) macht wieder einen Satz daraus.</div>` },

    { s:3, html:`<div class="ar ar-l">هٰذَا <span class="gold">هُوَ</span> الْحَقُّ</div>
      <div class="de big step" data-step="1">Das ist die Wahrheit.</div>` },

    { s:4, html:`<div class="rows">
        <div class="rowi"><div class="a">الْكِتَاب</div><div class="b">das Buch</div></div>
        <div class="rowi"><div class="a">الْحَقّ</div><div class="b">die Wahrheit</div></div>
        <div class="rowi"><div class="a">النَّاس</div><div class="b">die Menschen</div></div>
      </div>
      <div class="de step" data-step="1"><span class="ar ar-m gold">الْ</span> — ein Artikel für alles, vorne angeklebt</div>` },

    { s:4, html:`<div class="ar ar-l">وعليكم السلام ورحمة الله وبركاته</div>` }
  ]
};
</script>
